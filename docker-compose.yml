version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: mdtest_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: mdtest2
      MYSQL_USER: mdtest_user
      MYSQL_PASSWORD: mdtest_pass
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./proyecto2.sql:/docker-entrypoint-initdb.d/1-schema.sql
      - ./mejoras_db.sql:/docker-entrypoint-initdb.d/2-mejoras.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 20s
      retries: 10

  web:
    build: .
    container_name: mdtest_web
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_USER: mdtest_user
      DB_PASS: mdtest_pass
      DB_NAME: mdtest2
      PORT: 80
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./imagenes_preguntas:/var/www/html/imagenes_preguntas

volumes:
  db_data:
